<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Productivity Tracker</title>
  
  <!-- Mobile & PWA Configuration -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Productivity">
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="light dark">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Iframe clipping wrapper to remove Google Apps Script warning banner */
    #app-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #F8FAFC;
      z-index: 1;
    }

    /* 
      Shifts the Google Apps Script top warning bar (-38px) off-screen.
      Google's warning bar height is ~34-36px.
      Moving top by -38px completely eliminates the "created by another user" bar!
    */
    #app-frame {
      position: absolute;
      top: -38px;
      left: 0;
      width: 100%;
      height: calc(100% + 38px);
      border: none;
      display: block;
      background-color: #F8FAFC;
    }

    /* Native App Splash / Loading Screen */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-card {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.35);
      margin-bottom: 22px;
      overflow: hidden;
      animation: float 3s ease-in-out infinite;
    }

    .splash-logo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      margin-bottom: 28px;
    }

    /* Progress bar loader */
    .loader-track {
      width: 160px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #0284C7, #38BDF8);
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* Offline Alert Overlay */
    #offline-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 1000;
    }

    #offline-modal.active {
      display: flex;
    }

    .offline-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .offline-icon {
      font-size: 42px;
      margin-bottom: 16px;
    }

    .offline-card h3 {
      font-size: 18px;
      font-weight: 700;
      color: #0F172A;
      margin-bottom: 8px;
    }

    .offline-card p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .retry-btn {
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .retry-btn:active {
      background: #0369A1;
    }
  </style>
</head>
<body>

  <!-- Native Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo-card">
      <img src="/icon-192.png" alt="App Logo">
    </div>
    <div class="splash-title">Team Productivity Tracker</div>
    <div class="splash-subtitle">Daily POA & Work Done Logger</div>
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>

  <!-- Fullscreen Clipped App Viewport -->
  <div id="app-container">
    <iframe
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbwTKhzFTGORjQi3FAHSlyzPI2dt2-2wpj63GN22QTxHWOGo04jX2iSIFi5L5w73Zkuf/exec"
      title="Team Productivity Tracker"
      allow="clipboard-read; clipboard-write; fullscreen; storage-access *"
      sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation allow-storage-access-by-user-activation"
    ></iframe>
  </div>

  <!-- Offline State Modal -->
  <div id="offline-modal">
    <div class="offline-card">
      <div class="offline-icon">📡</div>
      <h3>No Internet Connection</h3>
      <p>Please check your connection to submit and synchronize your daily tasks.</p>
      <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
    </div>
  </div>

  <script>
    const splash = document.getElementById('splash-screen');
    const iframe = document.getElementById('app-frame');
    const offlineModal = document.getElementById('offline-modal');

    // Hide splash screen once Google Apps Script frame loads
    let loaded = false;
    function hideSplash() {
      if (!loaded) {
        loaded = true;
        setTimeout(() => {
          splash.classList.add('hidden');
        }, 500);
      }
    }

    iframe.addEventListener('load', hideSplash);

    // Failsafe timer: Dismiss splash after 8 seconds even on slow networks
    setTimeout(hideSplash, 8000);

    // Online / Offline Listeners
    function updateNetworkStatus() {
      if (!navigator.onLine) {
        offlineModal.classList.add('active');
      } else {
        offlineModal.classList.remove('active');
      }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    function retryConnection() {
      if (navigator.onLine) {
        offlineModal.classList.remove('active');
        iframe.src = iframe.src; // Reload iframe
      } else {
        alert('Still offline. Please check your network connection.');
      }
    }

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('ServiceWorker registered:', reg.scope))
          .catch((err) => console.warn('ServiceWorker registration failed:', err));
      });
    }
  </script>
</body>
</html>
